id = "local.sidebar"
name = "Sidebar"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Reports $head (agent logo + workspace name) for agent rows and $summary (agent status counts) for space rows"
platforms = ["macos"]

[[startup]]
command = ["python3", "-I", "refresh.py"]

[[events]]
on = "pane.agent_detected"
command = ["python3", "-I", "refresh.py"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "-I", "refresh.py"]

[[events]]
on = "pane.created"
command = ["python3", "-I", "refresh.py"]

[[events]]
on = "pane.closed"
command = ["python3", "-I", "refresh.py"]

[[events]]
on = "tab.created"
command = ["python3", "-I", "refresh.py"]

[[events]]
on = "tab.closed"
command = ["python3", "-I", "refresh.py"]

[[events]]
on = "workspace.created"
command = ["python3", "-I", "refresh.py"]
